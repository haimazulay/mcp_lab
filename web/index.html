<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Lab UI</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    h1 { margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 12px 0; }
    label { display:block; margin: 6px 0 4px; }
    input, textarea, button { font-size: 16px; padding: 8px; }
    pre { background: #111; color: #eee; padding: 12px; border-radius: 8px; overflow:auto; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>MCP Lab — Frontend UI</h1>
  <p>Call tools on your local Flask server.</p>

  <div class="card">
    <h2>Tools</h2>
    <button id="btnLoadTools">Load /tools</button>
    <pre id="toolsOut">(no data)</pre>
  </div>

  <div class="card">
    <h2>now</h2>
    <button id="btnNow">Call now</button>
    <pre id="nowOut">(no data)</pre>
  </div>

  <div class="card">
    <h2>weather</h2>
    <label for="city">City</label>
    <input id="city" placeholder="Tel Aviv" value="Tel Aviv" />
    <div class="row">
      <button id="btnWeather">Call weather</button>
    </div>
    <pre id="weatherOut">(no data)</pre>
  </div>

  <div class="card">
    <h2>ask_llm</h2>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" rows="3">Explain MCP in one sentence.</textarea>
    <label for="model">Model (optional)</label>
    <input id="model" placeholder="llama3.2:3b" />
    <div class="row">
      <button id="btnAsk">Call ask_llm</button>
    </div>
    <pre id="askOut">(no data)</pre>
  </div>

  <!-- Put script at the end so DOM exists. Alternatively add 'defer' on <script>. -->
  <script>
    const BASE = 'http://127.0.0.1:5000';

    const els = {
      btnLoadTools: document.getElementById('btnLoadTools'),
      btnNow: document.getElementById('btnNow'),
      btnWeather: document.getElementById('btnWeather'),
      btnAsk: document.getElementById('btnAsk'),
      toolsOut: document.getElementById('toolsOut'),
      nowOut: document.getElementById('nowOut'),
      weatherOut: document.getElementById('weatherOut'),
      askOut: document.getElementById('askOut'),
      city: document.getElementById('city'),
      prompt: document.getElementById('prompt'),
      model: document.getElementById('model')
    };

    async function getJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) {
        const text = await r.text();
        throw new Error('HTTP ' + r.status + ': ' + text);
      }
      return r.json();
    }

    els.btnLoadTools.addEventListener('click', async () => {
      try {
        const data = await getJSON(`${BASE}/tools`);
        els.toolsOut.textContent = JSON.stringify(data, null, 2);
      } catch (err) { els.toolsOut.textContent = String(err); }
    });

    els.btnNow.addEventListener('click', async () => {
      try {
        const data = await postJSON(`${BASE}/call`, { name: 'now', arguments: {} });
        els.nowOut.textContent = JSON.stringify(data, null, 2);
      } catch (err) { els.nowOut.textContent = String(err); }
    });

    els.btnWeather.addEventListener('click', async () => {
      try {
        const city = (els.city.value || 'Tel Aviv').trim();
        const data = await postJSON(`${BASE}/call`, { name: 'weather', arguments: { city } });
        els.weatherOut.textContent = JSON.stringify(data, null, 2);
      } catch (err) { els.weatherOut.textContent = String(err); }
    });

    els.btnAsk.addEventListener('click', async () => {
      try {
        const prompt = els.prompt.value.trim();
        const model = els.model.value.trim();
        const args = model ? { prompt, model } : { prompt };
        const data = await postJSON(`${BASE}/call`, { name: 'ask_llm', arguments: args });
        els.askOut.textContent = JSON.stringify(data, null, 2);
      } catch (err) { els.askOut.textContent = String(err); }
    });
  </script>
</body>
</html>
